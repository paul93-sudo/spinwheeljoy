<svg xmlns="http://www.w3.org/200/svg" width="900" height="600" viewBox="0 0 900 600">
<rect width="900" height="600" fill="#fff7ec"/>
<circle cx="90" cy="110" r="12" fill="#f15bb5" opacity="0.45"/>
<circle cx="810" cy="120" r="14" fill="#118ab2" opacity="0.45"/>
<rect x="0" y="480" width="900" height="120" fill="#f3e4cc"/>
<!-- wheel: 4 quadrant segments -->
<g stroke="#5b6b7c" stroke-width="5">
<path d="M450,300 L450,170 A130,130 0 0,1 580,300 Z" fill="#118ab2"/>
<path d="M450,300 L580,300 A130,130 0 0,1 450,430 Z" fill="#06d6a0"/>
<path d="M450,300 L450,430 A130,130 0 0,1 320,300 Z" fill="#f3722c"/>
<path d="M450,300 L320,300 A130,130 0 0,1 450,170 Z" fill="#9b5de5"/>
</g>
<circle cx="450" cy="300" r="24" fill="#ffffff" stroke="#5b6b7c" stroke-width="5"/>
<polygon points="434,120 466,120 450,158" fill="#5b6b7c"/>
<!-- hand from top left dropping a card -->
<g>
<rect x="180" y="20" width="90" height="150" rx="30" fill="#f5c6a0" stroke="#5b6b7c" stroke-width="5" transform="rotate(-24 225 95)"/>
<rect x="150" y="120" width="110" height="70" rx="10" fill="#ffffff" stroke="#5b6b7c" stroke-width="5" transform="rotate(-12 205 155)"/>
<line x1="170" y1="140" x2="240" y2="132" stroke="#5b6b7c" stroke-width="5" stroke-linecap="round"/>
<line x1="172" y1="160" x2="238" y2="152" stroke="#5b6b7c" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- stack of name cards -->
<g>
<rect x="120" y="420" width="120" height="70" rx="10" fill="#ffffff" stroke="#5b6b7c" stroke-width="5"/>
<line x1="140" y1="442" x2="220" y2="442" stroke="#9b5de5" stroke-width="6" stroke-linecap="round"/>
<line x1="140" y1="462" x2="200" y2="462" stroke="#5b6b7c" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
<rect x="112" y="408" width="120" height="70" rx="10" fill="#ffffff" stroke="#5b6b7c" stroke-width="5"/>
<line x1="132" y1="430" x2="212" y2="430" stroke="#118ab2" stroke-width="6" stroke-linecap="round"/>
<line x1="132" y1="450" x2="192" y2="450" stroke="#5b6b7c" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
</g>
<!-- cards flying out sorted by color -->
<g>
<rect x="620" y="180" width="100" height="60" rx="10" fill="#ffffff" stroke="#118ab2" stroke-width="6" transform="rotate(14 670 210)"/>
<line x1="640" y1="205" x2="700" y2="212" stroke="#118ab2" stroke-width="6" stroke-linecap="round"/>
<rect x="640" y="330" width="100" height="60" rx="10" fill="#ffffff" stroke="#06d6a0" stroke-width="6" transform="rotate(-10 690 360)"/>
<line x1="660" y1="355" x2="720" y2="350" stroke="#06d6a0" stroke-width="6" stroke-linecap="round"/>
<rect x="230" y="330" width="100" height="60" rx="10" fill="#ffffff" stroke="#f3722c" stroke-width="6" transform="rotate(10 280 360)"/>
<line x1="250" y1="352" x2="310" y2="358" stroke="#f3722c" stroke-width="6" stroke-linecap="round"/>
<rect x="250" y="180" width="100" height="60" rx="10" fill="#ffffff" stroke="#9b5de5" stroke-width="6" transform="rotate(-14 300 210)"/>
<line x1="270" y1="208" x2="330" y2="200" stroke="#9b5de5" stroke-width="6" stroke-linecap="round"/>
</g>
<!-- motion arcs -->
<g fill="none" stroke="#5b6b7c" stroke-width="4" opacity="0.4" stroke-linecap="round">
<path d="M560,220 C590,200 610,190 630,185"/>
<path d="M570,330 C600,335 620,340 640,345"/>
<path d="M340,330 C310,335 290,340 270,345"/>
<path d="M340,220 C310,205 290,195 272,190"/>
</g>
</svg>
