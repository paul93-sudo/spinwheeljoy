  <rect x="115" y="480" width="20" height="80" fill="#B08355" stroke="#3A3A3A" stroke-width="3"/>
  <rect x="715" y="480" width="20" height="80" fill="#B08355" stroke="#3A3A3A" stroke-width="3"/>
  <!-- ===== Flashcards racing between them ===== -->
  <g stroke="#8A8A8A" stroke-width="4" stroke-linecap="round">
    <line x1="250" y1="178" x2="302" y2="178"/>
    <line x1="240" y1="200" x2="298" y2="200"/>
