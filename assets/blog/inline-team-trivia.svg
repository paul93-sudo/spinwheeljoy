<svg xmlns="http://www.w3.org/200/svg" width="900" height="600" viewBox="0 0 900 600">
<rect width="900" height="600" fill="#fff7ec"/>
<rect x="0" y="460" width="900" height="140" fill="#f3e4cc"/>
<circle cx="120" cy="90" r="12" fill="#06d6a0" opacity="0.45"/>
<circle cx="780" cy="80" r="14" fill="#9b5de5" opacity="0.45"/>
<!-- question marks floating -->
<text x="200" y="120" font-family="sans-serif" font-size="54" font-weight="bold" fill="#ffca3a" stroke="#5b6b7c" stroke-width="1.5">?</text>
<text x="680" y="130" font-family="sans-serif" font-size="44" font-weight="bold" fill="#f15bb5" stroke="#5b6b7c" stroke-width="1.5">?</text>
<!-- long trivia table -->
<rect x="230" y="330" width="440" height="110" rx="14" fill="#8a5a33" stroke="#5b6b7c" stroke-width="6"/>
<rect x="230" y="330" width="440" height="34" rx="14" fill="#a9764a" stroke="#5b6b7c" stroke-width="6"/>
<!-- score cards -->
<g>
<rect x="330" y="250" width="90" height="70" rx="10" fill="#ffffff" stroke="#118ab2" stroke-width="6"/>
<text x="375" y="298" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#118ab2">12</text>
</g>
<g>
<rect x="480" y="250" width="90" height="70" rx="10" fill="#ffffff" stroke="#f3722c" stroke-width="6"/>
<text x="525" y="298" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#f3722c">9</text>
</g>
<!-- buzzer -->
<g>
<ellipse cx="450" cy="330" rx="34" ry="10" fill="#5b6b7c" opacity="0.25"/>
<rect x="420" y="312" width="60" height="18" rx="6" fill="#5b6b7c"/>
<circle cx="450" cy="306" r="26" fill="#e63946" stroke="#5b6b7c" stroke-width="6"/>
<ellipse cx="442" cy="298" rx="8" ry="5" fill="#ffffff" opacity="0.6"/>
</g>
<!-- blue team left -->
<g>
<circle cx="130" cy="300" r="24" fill="#f5c6a0" stroke="#5b6b7c" stroke-width="5"/>
<rect x="102" y="322" width="56" height="70" rx="16" fill="#118ab2" stroke="#5b6b7c" stroke-width="5"/>
<circle cx="130" cy="180" r="24" fill="#e8a87c" stroke="#5b6b7c" stroke-width="5"/>
<rect x="102" y="202" width="56" height="70" rx="16" fill="#118ab2" stroke="#5b6b7c" stroke-width="5"/>
<circle cx="130" cy="420" r="24" fill="#c68642" stroke="#5b6b7c" stroke-width="5"/>
<rect x="102" y="442" width="56" height="60" rx="16" fill="#118ab2" stroke="#5b6b7c" stroke-width="5"/>
</g>
<!-- orange team right -->
<g>
<circle cx="770" cy="300" r="24" fill="#e8a87c" stroke="#5b6b7c" stroke-width="5"/>
<rect x="742" y="322" width="56" height="70" rx="16" fill="#f3722c" stroke="#5b6b7c" stroke-width="5"/>
<circle cx="770" cy="180" r="24" fill="#f5c6a0" stroke="#5b6b7c" stroke-width="5"/>
<rect x="742" y="202" width="56" height="70" rx="16" fill="#f3722c" stroke="#5b6b7c" stroke-width="5"/>
<circle cx="770" cy="420" r="24" fill="#f5c6a0" stroke="#5b6b7c" stroke-width="5"/>
<rect x="742" y="442" width="56" height="60" rx="16" fill="#f3722c" stroke="#5b6b7c" stroke-width="5"/>
</g>
<!-- raised hands -->
<g stroke="#5b6b7c" stroke-width="8" stroke-linecap="round">
<line x1="160" y1="340" x2="200" y2="290"/>
<line x1="740" y1="340" x2="700" y2="290"/>
</g>
</svg>
