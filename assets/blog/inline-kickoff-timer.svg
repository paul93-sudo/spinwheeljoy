<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="#fdf6e3"/><text x="400" y="52" text-anchor="middle" font-size="34" font-weight="850" font-family="system-ui,sans-serif" fill="#17243d">Keep it under 45 minutes</text><circle cx="250" cy="290" r="150" fill="#fff" stroke="#17243d" stroke-width="3"/><text x="250" y="275" text-anchor="middle" font-size="72" font-weight="800" font-family="system-ui,sans-serif" fill="#17243d">45</text><text x="250" y="320" text-anchor="middle" font-size="24" font-weight="800" font-family="system-ui,sans-serif" fill="#17243d">MINUTES</text><g transform="translate(480 180)"><rect x="0" y="0" width="260" height="200" rx="10" fill="#fff" stroke="#17243d" stroke-width="3"/></g><text x="610" y="230" text-anchor="middle" font-size="20" font-weight="800" font-family="system-ui,sans-serif" fill="#17243d">10:00 START</text><text x="610" y="275" text-anchor="middle" font-size="20" font-weight="800" font-family="system-ui,sans-serif" fill="#17243d">10:15 TRIVIA</text><text x="610" y="320" text-anchor="middle" font-size="20" font-weight="800" font-family="system-ui,sans-serif" fill="#17243d">10:45 DONE</text><text x="400" y="470" text-anchor="middle" font-size="18" font-weight="800" font-family="system-ui,sans-serif" fill="#17243d">END ON TIME, EVERY TIME</text></svg>