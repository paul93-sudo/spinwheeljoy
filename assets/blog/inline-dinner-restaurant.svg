<g>
<circle cx="190" cy="200" r="34" fill="#f5c6a0" stroke="#5b6b7c" stroke-width="5"/>
<rect x="152" y="236" width="76" height="130" rx="22" fill="#9b5de5" stroke="#5b6b7c" stroke-width="5"/>
</g>
<g>
