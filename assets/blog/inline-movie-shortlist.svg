<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
<rect width="900" height="600" fill="#f8faff"/>
<text x="450" y="70" font-family="Verdana,sans-serif" font-size="32" font-weight="bold" fill="#1e2a4a" text-anchor="middle">Five to eight titles</text>
<g font-family="Verdana,sans-serif" font-size="24" fill="#1e2a4a">
<rect x="200" y="120" width="500" height="60" rx="12" fill="#e8eeff"/><text x="450" y="158" text-anchor="middle">1. Heist comedy</text>
<rect x="200" y="195" width="500" height="60" rx="12" fill="#fff0f0"/><text x="450" y="233" text-anchor="middle">2. Nature documentary</text>
<rect x="200" y="270" width="500" height="60" rx="12" fill="#fff8e8"/><text x="450" y="308" text-anchor="middle">3. Mystery</text>
<rect x="200" y="345" width="500" height="60" rx="12" fill="#e8fff0"/><text x="450" y="383" text-anchor="middle">4. Animated adventure</text>
<rect x="200" y="420" width="500" height="60" rx="12" fill="#f0e8ff"/><text x="450" y="458" text-anchor="middle">5. Light drama</text>
<rect x="200" y="495" width="500" height="60" rx="12" fill="#ffe8f5"/><text x="450" y="533" text-anchor="middle">6. Classic adventure</text>
</g>
</svg>