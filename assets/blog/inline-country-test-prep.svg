<svg xmlns="http://www.w3.org/200/svg" width="900" height="600" viewBox="0 0 900 600">
<rect width="900" height="600" fill="#fff7ec"/>
<rect x="0" y="470" width="900" height="130" fill="#f3e4cc"/>
<!-- desk -->
<rect x="60" y="420" width="520" height="30" rx="8" fill="#9b5de5" stroke="#5b6b7c" stroke-width="4"/>
<!-- laptop -->
<g>
<rect x="180" y="240" width="260" height="170" rx="10" fill="#5b6b7c"/>
<rect x="194" y="254" width="232" height="142" rx="6" fill="#ffffff"/>
<circle cx="310" cy="325" r="52" fill="#ffca3a" stroke="#5b6b7c" stroke-width="5"/>
<path d="M310,325 L310,273 A52,52 0 0 1 347,299 Z" fill="#06d6a0" stroke="#5b6b7c" stroke-width="4"/>
<path d="M310,325 L347,299 A52,52 0 0 1 362,325 Z" fill="#118ab2" stroke="#5b6b7c" stroke-width="4"/>
<path d="M310,325 L362,325 A52,52 0 0 1 347,351 Z" fill="#9b5de5" stroke="#5b6b7c" stroke-width="4"/>
<polygon points="310,258 301,274 319,274" fill="#ef476f" stroke="#5b6b7c" stroke-width="3"/>
<rect x="160" y="410" width="300" height="16" rx="8" fill="#5b6b7c"/>
</g>
<!-- student -->
<g>
<circle cx="660" cy="300" r="34" fill="#f5c6a0" stroke="#5b6b7c" stroke-width="5"/>
<rect x="620" y="336" width="80" height="140" rx="24" fill="#f3722c" stroke="#5b6b7c" stroke-width="5"/>
<line x1="620" y1="380" x2="520" y2="350" stroke="#5b6b7c" stroke-width="14" stroke-linecap="round"/>
</g>
<!-- wall sticky notes -->
<g font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#3b3b3b">
<rect x="600" y="90" width="110" height="70" rx="6" fill="#ffca3a" stroke="#5b6b7c" stroke-width="4"/>
<text x="655" y="130" text-anchor="middle">Lima</text>
<rect x="730" y="90" width="110" height="70" rx="6" fill="#06d6a0" stroke="#5b6b7c" stroke-width="4"/>
<text x="785" y="130" text-anchor="middle">Cairo</text>
<rect x="600" y="180" width="110" height="70" rx="6" fill="#9b5de5" stroke="#5b6b7c" stroke-width="4"/>
<text x="655" y="220" text-anchor="middle">Tokyo</text>
<rect x="730" y="180" width="110" height="70" rx="6" fill="#ef476f" stroke="#5b6b7c" stroke-width="4"/>
<text x="785" y="220" text-anchor="middle">?</text>
</g>
<!-- flashcards on desk -->
<g stroke="#5b6b7c" stroke-width="4">
<rect x="90" y="330" width="120" height="80" rx="6" fill="#ffffff" transform="rotate(-8 150 370)"/>
<rect x="480" y="340" width="120" height="80" rx="6" fill="#ffffff" transform="rotate(6 540 380)"/>
</g>
</svg>
