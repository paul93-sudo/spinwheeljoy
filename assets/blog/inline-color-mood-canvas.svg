<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
<rect width="900" height="600" fill="#f8faff"/>
<!-- easel legs -->
<line x1="450" y1="470" x2="360" y2="560" stroke="#8b5e34" stroke-width="16" stroke-linecap="round"/>
<line x1="450" y1="470" x2="540" y2="560" stroke="#8b5e34" stroke-width="16" stroke-linecap="round"/>
<line x1="450" y1="180" x2="450" y2="470" stroke="#8b5e34" stroke-width="14" stroke-linecap="round"/>
<line x1="380" y1="430" x2="520" y2="430" stroke="#8b5e34" stroke-width="12" stroke-linecap="round"/>
<!-- canvas -->
<rect x="330" y="190" width="240" height="200" rx="6" fill="#fdf6ec" stroke="#708198" stroke-width="6"/>
<!-- abstract red storm cloud painting -->
<ellipse cx="420" cy="260" rx="70" ry="44" fill="#c0392b"/>
<ellipse cx="470" cy="280" rx="60" ry="40" fill="#e74c3c"/>
<ellipse cx="450" cy="310" rx="80" ry="36" fill="#922b21"/>
<ellipse cx="400" cy="320" rx="44" ry="26" fill="#e74c3c" opacity="0.8"/>
<ellipse cx="505" cy="250" rx="30" ry="20" fill="#f1948a" opacity="0.7"/>
<line x1="430" y1="346" x2="410" y2="380" stroke="#f9eb24" stroke-width="6" stroke-linecap="round"/>
<line x1="480" y1="350" x2="500" y2="382" stroke="#f9eb24" stroke-width="6" stroke-linecap="round"/>
<!-- paint tube -->
<rect x="650" y="440" width="90" height="46" rx="10" fill="#fb7f81"/>
<rect x="740" y="452" width="26" height="22" rx="4" fill="#708198"/>
<text x="695" y="468" font-family="Verdana,sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">RED</text>
<!-- headline -->
<text x="450" y="90" font-family="Verdana,sans-serif" font-size="36" font-weight="bold" fill="#243b53" text-anchor="middle">DRAW THE FEELING</text>
</svg>
