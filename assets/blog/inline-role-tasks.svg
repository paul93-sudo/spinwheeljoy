<text x="450" y="64" font-family="Verdana,sans-serif" font-size="30" font-weight="bold" fill="#2b3a4a" text-anchor="middle">DEFINE THE ROLE FIRST</text>
<rect x="270" y="110" width="360" height="380" rx="14" fill="#ffffff" stroke="#2b3a4a" stroke-width="4"/>
<rect x="405" y="88" width="90" height="40" rx="10" fill="#2b3a4a"/>
