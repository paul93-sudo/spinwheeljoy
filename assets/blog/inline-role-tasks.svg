<text x="378" y="375" font-family="Verdana,sans-serif" font-size="20" font-weight="bold" fill="#2b3a4a">PER SLIDE</text>
<text x="450" y="556" font-family="Verdana,sans-serif" font-size="18" fill="#2b3a4a" text-anchor="middle">ten seconds of specifics beats a week of guessing</text>

