<rect x="150" y="400" width="80" height="80" rx="8" fill="#fb7f81"/>
<rect x="245" y="420" width="60" height="60" rx="8" fill="#38bdf8"/>
<circle cx="700" cy="430" r="50" fill="#ffcd68"/>
<rect x="620" y="440" width="70" height="40" rx="8" fill="#34c98e"/>
<!-- child figure -->
<circle cx="450" cy="270" r="52" fill="#ffd9b3"/>
<path d="M400,268 a52,52 0 0,1 100,0 l0,-14 a52,40 0 0,0 -100,0 z" fill="#5b3a29"/>
<rect x="404" y="322" width="92" height="120" rx="24" fill="#315fe9"/>
<line x1="420" y1="442" x2="415" y2="520" stroke="#243b53" stroke-width="22" stroke-linecap="round"/>
<line x1="480" y1="442" x2="485" y2="520" stroke="#243b53" stroke-width="22" stroke-linecap="round"/>
