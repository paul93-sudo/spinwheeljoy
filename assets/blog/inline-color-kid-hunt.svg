<circle cx="640" cy="318" r="34" fill="#ffcd68" opacity="0.35"/>
<!-- headline -->
<text x="450" y="90" font-family="Verdana,sans-serif" font-size="36" font-weight="bold" fill="#243b53" text-anchor="middle">FIND THE COLOR</text>
<text x="450" y="140" font-family="Verdana,sans-serif" font-size="24" fill="#5b6b7c" text-anchor="middle">spin a color, hunt five things that match</text>
</svg>
