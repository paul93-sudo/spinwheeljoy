<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
<rect width="900" height="600" fill="#f8faff"/>
<!-- three comic panels -->
<rect x="70" y="150" width="230" height="300" rx="10" fill="#ffcd68" stroke="#243b53" stroke-width="6"/>
<circle cx="150" cy="260" r="44" fill="#fff3d6"/>
<rect x="100" y="360" width="170" height="16" rx="8" fill="#243b53" opacity="0.7"/>
<rect x="120" y="390" width="130" height="16" rx="8" fill="#243b53" opacity="0.5"/>
<text x="185" y="200" font-family="Verdana,sans-serif" font-size="26" font-weight="bold" fill="#243b53" text-anchor="middle">1</text>
<rect x="335" y="150" width="230" height="300" rx="10" fill="#38bdf8" stroke="#243b53" stroke-width="6"/>
<rect x="385" y="230" width="130" height="90" rx="10" fill="#e3f4fd"/>
<circle cx="450" cy="275" r="26" fill="#38bdf8"/>
<rect x="365" y="360" width="170" height="16" rx="8" fill="#243b53" opacity="0.7"/>
<rect x="385" y="390" width="130" height="16" rx="8" fill="#243b53" opacity="0.5"/>
<text x="450" y="200" font-family="Verdana,sans-serif" font-size="26" font-weight="bold" fill="#243b53" text-anchor="middle">2</text>
<rect x="600" y="150" width="230" height="300" rx="10" fill="#6d5bd0" stroke="#243b53" stroke-width="6"/>
<circle cx="690" cy="250" r="30" fill="#f4f1ff"/>
<circle cx="745" cy="290" r="14" fill="#f4f1ff"/>
<circle cx="650" cy="300" r="10" fill="#f4f1ff"/>
<rect x="630" y="360" width="170" height="16" rx="8" fill="#f4f1ff" opacity="0.9"/>
<rect x="650" y="390" width="130" height="16" rx="8" fill="#f4f1ff" opacity="0.6"/>
<text x="715" y="200" font-family="Verdana,sans-serif" font-size="26" font-weight="bold" fill="#f4f1ff" text-anchor="middle">3</text>
<!-- headline -->
<text x="450" y="90" font-family="Verdana,sans-serif" font-size="36" font-weight="bold" fill="#243b53" text-anchor="middle">THREE COLORS, THREE PANELS</text>
