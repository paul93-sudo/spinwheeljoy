name: SpinWheelJoy SEO integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sitemap-and-indexing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SEO unit tests
        run: node --test scripts/seo/seo-tests.mjs
      - name: Verify indexability, canonicals, sitemap and directories
        run: |
          node scripts/seo/enrich-tools.mjs --check
          node scripts/seo/generate-sitemap.mjs --check
          node scripts/seo/check-seo.mjs
      - name: Report editorial image readiness (nonblocking)
        run: node scripts/seo/media-audit.mjs
